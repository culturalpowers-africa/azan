name: Route matrix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ['/', '/guidance', '/dreams', '/approach', '/contact', '/about', '/journal', '/resources', '/faq', '/pricing', '/privacy', '/terms', '/accessibility', '/community', '/services/dreams', '/services/love', '/services/protection', '/services/prosperity', '/services/ancestors', '/about/method', '/about/practitioner', '/about/values', '/community/events', '/community/stories', '/contact/booking', '/contact/contact-faq', '/contact/whatsapp', '/journal/ancestral-memory', '/journal/grounding-at-home', '/journal/prosperity-with-purpose', '/journal/relationship-boundaries', '/journal/understanding-dream-symbols', '/services/ancestors/lineage', '/services/dreams/follow-up', '/services/dreams/what-to-bring', '/services/love/communication', '/services/love/family', '/services/prosperity/business', '/services/protection/grounding', '/services/protection/home']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
      - run: for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
      - run: curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:4173${{ matrix.path }} | grep -q '^200$'
