name: HTML and source validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check required production files
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f public/manus-routes.json
          grep -q 'main-content' index.html
          grep -q 'wa.me/27732552543' index.html
