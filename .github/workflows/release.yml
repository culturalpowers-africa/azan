name: Production artifact

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: npm test
      - name: Upload production dist
        uses: actions/upload-artifact@v4
        with:
          name: ancestralpath-production
          path: dist
          if-no-files-found: error
          retention-days: 14
