server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self' https://wa.me; frame-ancestors 'none'; img-src 'self' data: https://wa.me; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'" always;

  location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
  location = /404.html { add_header Cache-Control "no-store" always; }
  location ~* \.(?:css|js|jpg|jpeg|png|webp|avif|svg|woff2)$ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location / { try_files $uri $uri/ =404; }
}
